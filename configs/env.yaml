# CFGNavEnv settings (plan section 10).
env:
  # Successor slots. On the training graphs 99.2% of nodes have at most 2 successors and
  # every wider node is a switch. K = 6 leaves 94% of graphs untouched; the remaining wide
  # switches are rewritten as dispatch chains when the graphs are built (configs/data.yaml,
  # graphs.max_out_degree). See data/processed/stats.json.
  k: 6
  max_steps_cap: 200
  max_steps_per_node: 4.0  # step budget = min(max_steps_cap, max_steps_per_node * |V|)
  max_declares: 1
  feature_tier: "L"
  allow_backtrack: true
  strict_masks: true
  masked_features: []      # feature names to zero out, for ablations
reward:
  step: -0.01              # every move, backtrack or wasted action
  revisit: -0.02           # extra, for moving onto an already visited node
  correct: 1.0
  wrong: -0.5
  timeout: -0.5            # step budget exhausted, or stuck in a dead end
  shaping: false           # potential-based shaping; training-time only
  shaping_beta: 0.05
  gamma: 0.99              # keep equal to the agent's discount

# Graph-size curriculum (plan section 10.6). Off by default; enable here or with
# `scripts/train.py --curriculum` if training on the full size range stalls.
curriculum:
  enabled: false
  start_cap: 20            # largest graph, in nodes, sampled at the start
  growth: 1.5              # factor applied to the cap each time it widens
  success_threshold: 0.8   # widen once the rolling success rate reaches this
  window: 200              # episodes in the rolling window
  widen_every: null        # or widen every N episodes regardless of success
