# CFGNavEnv settings (plan section 10).
env:
  k: 6                     # successor slots; confirm against data/processed/stats.json
  max_steps_cap: 200
  max_steps_per_node: 4.0  # step budget = min(max_steps_cap, max_steps_per_node * |V|)
  max_declares: 1
  feature_tier: "L"
  allow_backtrack: true
  strict_masks: true
reward:
  step: -0.01              # every move, backtrack or wasted action
  revisit: -0.02           # extra, for moving onto an already visited node
  correct: 1.0
  wrong: -0.5
  timeout: -0.5            # step budget exhausted, or stuck in a dead end
  shaping: false           # potential-based shaping; training-time only
  shaping_beta: 0.05
  gamma: 0.99              # keep equal to the agent's discount
