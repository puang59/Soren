# Dataset selection and preprocessing (plan sections 7-9).
# CWE-119 and CWE-125 leave 1,578 usable functions (1,251 + 327), above the 1,000 threshold
# of the decision gate, so they are kept as two categories. See notebooks/01_eda.ipynb.
cwes: ["CWE-119", "CWE-125"]
min_lines: 5
max_lines: 300
# Graph construction (scripts/04_build_graphs.py).
graphs:
  min_nodes: 5             # CFG nodes, ENTRY and EXIT included
  max_nodes: 300
  min_coverage: 0.6        # share of code lines the parse must account for
  max_out_degree: 6        # wider nodes (large switches) become dispatch chains; equals env k

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 0

# API name lists behind the Tier L call flags (plan section 9.2).
lexicon:
  dangerous_calls: [
    memcpy, memmove, memset, strcpy, strncpy, strcat, strncat, sprintf, snprintf,
    vsprintf, vsnprintf, gets, fgets, scanf, sscanf, read, recv, recvfrom, fread,
    copy_from_user, copy_to_user, alloca, bcopy,
  ]
  alloc_calls: [
    malloc, calloc, realloc, kmalloc, kzalloc, kcalloc, krealloc, vmalloc, vzalloc,
    kvmalloc, av_malloc, g_malloc, new,
  ]
  free_calls: [
    free, kfree, vfree, kvfree, av_free, g_free, delete,
  ]
