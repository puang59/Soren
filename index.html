A reinforcement learning agent that localizes a vulnerability inside a C or C++ function by
walking the function's control flow graph. This document explains how the system is built,
exactly how it uses reinforcement learning, where each piece lives in the code, and what is
new about it.

## 1. What the system does

**Input:** a function that is known to contain a vulnerability.
**Output:** the statement the agent believes is the vulnerable one, plus the path it took to
get there.

Existing detectors (graph neural networks, Transformers) read a whole function in one pass and
answer "vulnerable or not". They do not say where, and they do not model a search. Soren
treats localization as **sequential decision-making**: an agent stands on one statement, sees
only that statement and the ones directly reachable from it, and repeatedly chooses to move,
go back, or declare.

---

## 2. Architecture

The system has two halves joined by one data format. The offline half turns source code into
graphs. The online half is the reinforcement learning loop.

```mermaid
flowchart TD
    subgraph OFFLINE["Offline data pipeline"]
        A["BigVul dataset<br/>217,007 functions"] --> B["Filter<br/>vulnerable, CWE-119/125,<br/>has a usable fix"]
        B --> C["Write each function<br/>as .c and .cpp"]
        C --> D["Joern<br/>expression-level CFG"]
        D --> E["Collapse to one node<br/>per source line"]
        E --> F["Align fix lines to nodes<br/>(ground truth)"]
        F --> G["Split by fixing commit<br/>1,023 / 128 / 127"]
    end

    G --> H[("GraphRecord files<br/>train / val / test")]

    subgraph ONLINE["Reinforcement learning"]
        H --> I["CFGNavEnv<br/>Gymnasium environment"]
        I <-->|"observation, reward<br/>action"| J["MaskablePPO agent<br/>actor + critic networks"]
        H --> K["Baselines<br/>DFS, BFS, line order,<br/>heuristic-first"]
    end

    J --> L["Evaluation harness<br/>metrics, confidence intervals"]
    K --> L
    L --> M["Web visualizer<br/>replays each walk"]
```

| Layer | What it does | Where |
|---|---|---|
| Data pipeline | BigVul to line-level control flow graphs with labels | `soren/data/`, `scripts/01`–`06` |
| Shared record | One function: nodes, edges, vulnerable nodes, source | `soren/data/schema.py` |
| Features | 30 numbers per statement | `soren/data/features.py` |

**Design principle.** Everything after the data pipeline reads only `GraphRecord`. That let
the environment and agent be built and validated on synthetic graphs before any real data
existed (`soren/data/synthetic.py`).

## 3. The problem as a Markov decision process

A reinforcement learning problem is defined by states, actions, transitions, rewards and a
termination rule. Here is each one for Soren.

```mermaid
flowchart LR
    S["State s<br/>where the agent stands,<br/>what it has visited"] -->|"observe 248 numbers"| P["Policy π(a | s)<br/>actor network"]
    P -->|"action a<br/>move / backtrack / declare"| E["Environment<br/>CFGNavEnv.step()"]
    E -->|"reward r"| P
    E -->|"next state s'"| S
```

### State and observation

The true state is the agent's position, its path so far, and which statements it has visited.
The agent does not see the whole graph. It receives an **observation of 248 numbers**, all
scaled to between 0 and 1:

| Part | Size | Content |
|---|---|---|
| Current statement | 30 | Its features (see below) |
| Current statement, episode info | 2 | How often visited; already declared here |
| Six successor slots | 6 × 33 = 198 | For each next statement: a "slot used" flag, its 30 features, visited before, is a loop back edge |
| Backtrack target | 13 | Whether backtracking is possible, and what kind of statement it leads to |
| Episode context | 5 | Fraction of step budget used, fraction of graph visited, path depth, graph size, declarations left |

Because the agent sees only one step ahead, this is strictly a **partially observable** MDP.
The "visited" flags act as a small memory so the policy does not need to be recurrent.

The 30 per-statement features (`soren/data/features.py`):

- **Structural (17):** statement kind as a one-hot (assignment, call, branch, loop, switch,
  return, jump, declaration, other, entry, exit), in-degree, out-degree, depth from the entry,
  inside a loop, is a loop header, relative line position.
- **Lexical (13):** calls any function, calls a dangerous API (`memcpy`, `strcpy`, ...),
  allocates, frees, indexes an array, dereferences a pointer, pointer arithmetic, arithmetic,
  comparison, `sizeof`, cast, mentions a length-like variable, token count.

Building the observation, `soren/env/cfg_nav_env.py:279`:

```python
# 3. Successor slots: [valid, features, visited_before, is_back_edge].
for slot, succ in enumerate(graph.successors(self.node)):
    base = pos + slot * self._slot_dim
    obs[base] = 1.0
    obs[base + 1 : base + 1 + f] = feats[succ]
    obs[base + 1 + f] = float(self.visits[succ] > 0)
    obs[base + 2 + f] = float(graph.is_back_edge(self.node, succ))
```

### Actions

Eight discrete actions:

| Index | Action | Meaning |
|---|---|---|
| 0–5 | `MOVE_i` | Go to the i-th statement reachable from here |
| 6 | `BACKTRACK` | Return to the statement the agent came from |
| 7 | `DECLARE` | Say "this statement is the vulnerability" |

A statement rarely has six successors, so most actions are invalid most of the time. The
environment reports which are valid, `soren/env/cfg_nav_env.py:138`:

```python
def action_masks(self) -> np.ndarray:
    """Boolean mask over actions; ``True`` marks a valid action in the current state."""
    mask = np.zeros(self.config.k + 2, dtype=bool)
    if self._done:
        return mask
    mask[: len(self.graph.successors(self.node))] = True
    mask[self.backtrack_action] = self.config.allow_backtrack and bool(self.stack)
    mask[self.declare_action] = (
        self.graph.nodes[self.node].kind not in ("ENTRY", "EXIT")
        and self.node not in self.declared
        and self.declares_left > 0
    )
    return mask
```

### Transitions

Deterministic: a move goes exactly where the edge points. The core of
`CFGNavEnv.step()`, `soren/env/cfg_nav_env.py:204`:

```python
elif action < self.config.k:                       # MOVE_i
    target = graph.successors(prev)[action]
    self.stack.append(prev)
    event = StepEvent(graph, "move", prev, target, revisit=bool(self.visits[target]))
    self._arrive(target)
elif action == self.backtrack_action:              # BACKTRACK
    target = self.stack.pop()
    event = StepEvent(graph, "backtrack", prev, target)
    self._arrive(target)
else:                                              # DECLARE
    correct = prev in graph.vuln_set
    self.declared.append(prev)
    self.declares_left -= 1
    event = StepEvent(graph, "declare", prev, prev, correct=correct)
    if correct:
        self.is_success = True
        terminated, self.end_reason = True, "correct"
    elif self.declares_left == 0:
        terminated, self.end_reason = True, "wrong_declare"
```

### Reward

| Event | Reward |
|---|---|
| Any move or backtrack | −0.01 |
| Moving onto an already visited statement | a further −0.02 |
| Declaring a vulnerable statement | **+1.0** |
| Declaring any other statement | **−0.5** |
| Step budget exhausted | −0.5 |

The whole reward function, `soren/env/rewards.py:53`:

```python
def base_reward(event: StepEvent, cfg: RewardConfig) -> float:
    """The unshaped reward for one step."""
    reward = 0.0
    if event.action == "declare":
        reward += cfg.correct if event.correct else cfg.wrong
    else:
        reward += cfg.step
        if event.action == "move" and event.revisit:
            reward += cfg.revisit
    if event.timeout or event.dead_end:
        reward += cfg.timeout
    return reward
```

The values are in `configs/env.yaml`. The small step cost makes short searches preferable;
the large gap between +1.0 and −0.5 makes a correct declaration the goal.

### Termination

An episode ends when the agent declares, or after `min(200, 4 × number of statements)` steps.

## 4. Mapping to reinforcement learning concepts

| Concept | In Soren |
|---|---|
| **Agent** | The PPO policy that walks the graph |
| **Environment** | `CFGNavEnv`: one vulnerable function as a control flow graph |
| **State s** | Current statement, path taken, visited statements |
| **Observation** | 248 numbers describing the current statement and its successors |
| **Action a** | Move to a successor, backtrack, or declare (8 discrete actions) |
| **Reward r** | −0.01 per step, +1.0 correct, −0.5 wrong or out of steps |
| **Episode** | One attempt on one function, from ENTRY to a declaration or timeout |
| **Sequence of actions** | The walk itself, for example move, move, declare |
| **Return G** | Sum of rewards in an episode; about +0.98 for a quick correct answer |
| **Policy π(a \| s)** | The **actor network**: gives a probability to each action |
| **State value V(s)** | The **critic network**: predicts the return from this state onward |
| **Action value Q(s, a)** | **Not learned directly.** PPO uses the *advantage* A(s, a) = Q(s, a) − V(s), estimated from sampled returns with GAE |
| **Advantage A(s, a)** | How much better an action turned out than the critic expected; this is what pushes the policy |
| **Model of the environment** | None. The method is **model-free** |
| **Planning / MCTS** | **Not used.** See section 10 |
| **Deep RL** | Yes: policy and value function are neural networks trained by gradient descent |
| **Exploration** | Sampling from the policy during training, encouraged by an entropy bonus |
| **On-policy / off-policy** | On-policy: each batch of experience is used for one update and discarded |

## 5. The algorithm: PPO with action masking

**Proximal Policy Optimization (PPO)** is a policy-gradient, actor-critic method. It keeps two
functions:

- the **actor** π_θ(a | s), which chooses actions;
- the **critic** V_φ(s), which estimates how good a state is.

Soren uses `MaskablePPO` from the `sb3-contrib` library, which is PPO plus support for
invalid-action masks.

### Step 1: collect experience

Run the current policy in 16 environments for 512 steps each. That gives 8,192 transitions
(s, a, r, s′), each with the critic's V(s) and the probability the actor gave the action.

### Step 2: estimate advantages with GAE

For each transition compute the one-step surprise (the TD error):

```
δ_t = r_t + γ · V(s_{t+1}) − V(s_t)
```

Then the Generalized Advantage Estimate is a discounted sum of these:

```
A_t = δ_t + (γλ) · δ_{t+1} + (γλ)² · δ_{t+2} + ...        with γ = 0.99, λ = 0.95
```

This is where V(s) and Q(s, a) meet: `A_t` estimates Q(s_t, a_t) − V(s_t) without ever
learning Q. The value target for the critic is `R_t = A_t + V(s_t)`.

### Step 3: update both networks by gradient descent

The probability ratio between the new and old policy:

```
ρ_t(θ) = π_θ(a_t | s_t) / π_θ_old(a_t | s_t)
```

**Policy (actor) loss**, the clipped surrogate objective:

```
L_policy = − mean( min( ρ_t · A_t ,  clip(ρ_t, 1 − ε, 1 + ε) · A_t ) )        ε = 0.2
```

The clip is what "proximal" means: if an update would change an action's probability by more
than 20%, the extra gain is ignored. That stops one batch of lucky episodes from wrecking the
policy.

**Value (critic) loss:**

```
L_value = mean( (V_φ(s_t) − R_t)² )
```

**Entropy bonus**, which rewards the policy for staying uncertain and therefore exploring:

```
H = mean( entropy of π_θ(· | s_t) )
```

**Total loss minimised:**

```
L = L_policy + 0.5 · L_value − 0.01 · H
```

Gradients of `L` are computed by backpropagation through both networks, clipped to a norm of
0.5, and applied with the **Adam** optimiser.

### Action masking

Before sampling, the logits of invalid actions are set to a very large negative number, so
their probability is zero. The agent can never try to move to a successor that does not
exist. Without this the agent would waste most of its early training discovering which of the
8 actions are legal in each state.

### Where this is configured

`soren/agents/ppo.py:87`:

```python
def build_model(venv, cfg, seed=0, tensorboard_log=None) -> MaskablePPO:
    return MaskablePPO(
        "MlpPolicy",
        venv,
        n_steps=cfg.n_steps,                 # 512 steps per environment per rollout
        batch_size=cfg.batch_size,           # 512 transitions per gradient step
        n_epochs=cfg.n_epochs,               # 10 passes over each rollout
        learning_rate=learning_rate_schedule(cfg),
        gamma=cfg.gamma,                     # 0.99
        gae_lambda=cfg.gae_lambda,           # 0.95
        clip_range=cfg.clip_range,           # 0.2
        ent_coef=cfg.ent_coef,               # 0.01
        vf_coef=cfg.vf_coef,                 # 0.5
        max_grad_norm=cfg.max_grad_norm,     # 0.5
        policy_kwargs={
            "net_arch": {"pi": list(cfg.net_arch), "vf": list(cfg.net_arch)},
            "activation_fn": _ACTIVATIONS[cfg.activation],
        },
        ...
    )
```

The values come from `configs/ppo.yaml`. (The comments above are added here for explanation.)

## 6. The neural network

Two separate multilayer perceptrons with no shared layers. This is the actual structure of the
trained checkpoint.

```mermaid
flowchart LR
    O["Observation<br/>248 numbers"]

    subgraph ACTOR["Actor (policy network)"]
        direction LR
        A1["Linear 248 → 256<br/>tanh"] --> A2["Linear 256 → 256<br/>tanh"] --> A3["Linear 256 → 8<br/>logits"]
    end

    subgraph CRITIC["Critic (value network)"]
        direction LR
        C1["Linear 248 → 256<br/>tanh"] --> C2["Linear 256 → 256<br/>tanh"] --> C3["Linear 256 → 1"]
    end

    O --> A1
    O --> C1
    A3 --> M["Mask invalid actions<br/>then softmax"]
    M --> PI["π(a | s)<br/>8 action probabilities"]
    C3 --> V["V(s)<br/>one number"]
```

| Layer | Shape | Parameters |
|---|---|---|
| Actor hidden 1 | 248 → 256 | 63,744 |
| Actor hidden 2 | 256 → 256 | 65,792 |
| Actor output | 256 → 8 | 2,056 |
| Critic hidden 1 | 248 → 256 | 63,744 |
| Critic hidden 2 | 256 → 256 | 65,792 |
| Critic output | 256 → 1 | 257 |
| **Total** | | **261,385** |

- **Input:** the 248-number observation.
- **Activation:** tanh after each hidden layer.
- **Actor output:** 8 logits. After masking and softmax they are the probabilities
  π(a | s). During training an action is *sampled* from them; at test time the most probable
  valid action is taken.
- **Critic output:** a single number, V(s).
- **Optimiser:** Adam, learning rate 3 × 10⁻⁴ decaying linearly to zero over training.

Why a plain MLP and not a graph neural network: the observation is already a fixed-length
vector describing the local neighbourhood, so no graph encoder is needed for the agent to act.
A GNN over the whole function is listed as future work.

flowchart TD

| Mean episode length, in actions | 4.3 | 3.8 | 4.1 | 4.6 | 4.8 | 3.9 |
| Policy entropy | 0.76 | 0.54 | 0.21 | 0.11 | 0.06 | 0.07 |
| Value loss | 3.02 | 2.26 | 1.61 | 1.24 | 1.05 | 0.99 |
| Explained variance of the critic | −0.03 | 0.33 | 0.50 | 0.63 | 0.69 | 0.72 |
| Approximate KL per update | 0.006 | 0.008 | 0.005 | 0.004 | 0.002 | 0.000 |
| Clip fraction | 4.2% | 8.9% | 3.8% | 2.9% | 1.8% | 0.0% |
| Learning rate | 2.98 × 10⁻⁴ | 2.73 × 10⁻⁴ | 2.26 × 10⁻⁴ | 1.53 × 10⁻⁴ | 0.76 × 10⁻⁴ | 0 |
| Share of actions: move | 57% | 65% | 73% | 77% | 78% | 77% |
| Share of actions: backtrack | 20% | 9% | 2% | 2% | 1% | 1% |
| Share of actions: declare | 23% | 27% | 25% | 21% | 21% | 22% |

Training throughput was about 9,000 timesteps per second on a laptop CPU.

**How to read these.**

- **The optimisation is healthy.** Value loss falls, the critic's explained variance climbs
  from 0 to 0.72, entropy falls smoothly as the policy becomes decisive, and the KL and clip
  fraction stay small, so updates never jump. Nothing here looks like a broken training run.
- **The agent overfits.** Success on training functions keeps rising to 56%, while success on
  validation functions peaks near 20% by 250,000 timesteps and then drifts down. After that
  point the agent is memorising the functions it trains on, not learning something that
  carries over. This is why the best checkpoint is early (300,000 to 500,000 in four of five
  seeds) and why checkpoints are chosen on validation.
- **It learns not to backtrack.** Backtracking falls from 20% of actions to 1%. The learned
  behaviour is a short walk forward followed by one declaration.

### The training loop in code

`soren/agents/train.py:70`:

```python
venv = make_vec_env(train_graphs, env_config, reward_config, ppo_config, seed, curriculum)
try:
    model = build_model(
        venv, ppo_config, seed, tensorboard_log=str(run_dir / "tb") if tensorboard else None
    )
    validation = ValidationCallback(
        val_graphs, env_config, reward_config, ppo_config.eval_freq, run_dir
    )
    callbacks = CallbackList([validation, DiagnosticsCallback(env_config.k)])
    model.learn(total_timesteps=ppo_config.total_timesteps, callback=callbacks)
```

Each of the 16 environments samples a random training function at the start of every episode
(`CFGNavEnv.reset`, `soren/env/cfg_nav_env.py:178`). Rewards are normalised by a running
estimate during training (`VecNormalize`, `soren/agents/ppo.py:59`); observations are already
in [0, 1].

### Choosing the checkpoint

Training does not simply keep the last network. Every 50,000 timesteps the policy is run once
on every validation function, and the best one is saved,
`soren/agents/callbacks.py:46`:

```python
key = (metrics["success_rate"], -metrics["nodes_inspected"])
if self.best_key is None or key > self.best_key:
    self.best_key = key
    self.best_metrics = metrics
    self.model.save(self.run_dir / "best_model")
```

The test set plays no part in this. It is evaluated once, at the end.

### Running it

```bash
python scripts/run_arm.py --group final --name base --seed 0 --timesteps 1000000
```

## 8. A real episode, step by step

Function `bigvul_048191` from the miniupnp project, a test function the agent never trained
on. It is a buffer overflow: `memcpy` copies `l` bytes with no bounds check.

```c
1  void IGDstartelt(void * d, const char * name, int l)
2  {
3      struct IGDdatas * datas = (struct IGDdatas *)d;
4     memcpy( datas->cureltname, name, l);          <-- the fix changed this line
5      datas->cureltname[l] = '\0';
6      datas->level++;
...
```

The trained agent's sequence of actions, with its own probabilities:

| Step | Standing on | What the actor output | Action taken | Reward |
|---|---|---|---|---|
| 1 | ENTRY | move to line 3: 100% | move | −0.01 |
| 2 | line 3 | move to line 4: 99.99%, backtrack: 0.01%, declare: 0% | move | −0.01 |
| 3 | line 4 (`memcpy`) | **declare: 98.6%**, backtrack: 1.2%, move to line 5: 0.1% | **declare** | **+1.0** |

Return for the episode: −0.01 − 0.01 + 1.0 = **+0.98**. Three actions, 3 of 11 statements
inspected, correct.

What this shows:

- **Sequence of actions:** move, move, declare.
- **Policy π(a | s):** the percentages in the third column are the actor's output at each step.
- **Value V(s):** the critic's estimate rose as the agent approached the `memcpy`, from 0.63 at
  line 3 to 1.71 at line 4. (These are in normalised reward units, which is why they can
  exceed 1.)
- **Learned behaviour:** on a plain assignment it keeps moving; on a call to a dangerous API
  it switches almost entirely to declaring.

You can replay this episode in the web visualizer: open `web-app/index.html` and select
`bigvul_048191`.

## 9. The other algorithms

These are the non-learning methods the agent is compared against. None of them use rewards,
gradients or a neural network.

| Method | How it chooses the next statement | Code |
|---|---|---|
| **Depth-first search (DFS)** | Follow the first unvisited successor as deep as possible; back up at dead ends | `soren/baselines/dfs.py:11` |
| **Breadth-first search (BFS)** | Everything one step from the entry, then two steps, and so on | `soren/baselines/bfs.py` |
| **Random walk** | A uniformly random valid move or backtrack | `soren/baselines/random_walk.py` |
| **Line order** | Top of the function to the bottom | `soren/baselines/reference.py` |
| **Random order** | A random permutation of all statements | `soren/baselines/reference.py` |
| **Heuristic-first** | Best-first search on a hand-written suspicion score | `soren/baselines/heuristic.py:88` |

The whole of DFS's decision rule, `soren/baselines/dfs.py:20`:

```python
def choose(self, env: CFGNavEnv, rng: np.random.Generator) -> int | None:
    for slot, succ in enumerate(env.graph.successors(env.node)):
        if env.visits[succ] == 0:
            return slot
    return env.backtrack_action if env.stack else None
```

### Two ways of scoring them

A search order has no built-in way to say "this is the one", so two protocols are used.

- **Protocol A (oracle stop).** The method is stopped automatically the moment it stands on a
  vulnerable statement (`oracle_stop`, `soren/baselines/base.py:38`). It cannot be wrong. This
  measures only how many statements it had to look at.
- **Protocol B (must declare).** The method declares at the first statement whose suspicion
  score reaches a threshold (`ThresholdRule`, `soren/baselines/heuristic.py:77`). It can be
  wrong, exactly like the agent. **This is the fair comparison.**

The suspicion score is a weighted sum of the lexical flags
(`HeuristicScorer`, `soren/baselines/heuristic.py:48`): dangerous call 3, array subscript 2,
pointer arithmetic 2, pointer dereference 1, allocation 1, length-like variable 1,
arithmetic 0.5.

### A supervised reference

A small classifier (`soren/baselines/node_classifier.py`) is trained on the same 30 features
to predict whether a statement is vulnerable, and ranks every statement of a function at once.
It is not a search method. It measures how much the features can say when nothing is hidden.

## 10. Related deep RL algorithms and why PPO

| Algorithm | What it learns | Why it was or was not used |
|---|---|---|
| **PPO** (used) | Policy π(a \| s) and value V(s) | Stable, on-policy, and a version with invalid-action masking exists |
| **DQN** | Action value Q(s, a); acts by picking the largest Q | Planned as a comparison. The standard implementation has no action masking, so it needs a custom version. Not implemented |
| **A2C / A3C** | Policy and value, like PPO | Same family; PPO's clipped objective is more stable and reuses each batch for several updates |
| **TRPO** | Policy with a hard limit on how far each update moves | PPO is its simpler successor with comparable results |
| **REINFORCE** | Policy only, from whole-episode returns | High variance; the critic in PPO reduces it |
| **MCTS / AlphaZero** | Plans by simulating futures in a search tree | See below |

### Why not Monte Carlo Tree Search

MCTS needs to simulate "what happens if I take this action" and get a reward back. Soren's
transitions are easy to simulate (the graph is known), but the **reward is not available at
test time**: whether a declaration is correct is exactly what we are trying to find out. A
tree search would need a learned value function to stand in for it, which is the AlphaZero
recipe. That is a possible extension; the simpler model-free method was the right first step.

### V(s) versus Q(s, a) in this project

- **V(s)** is learned: it is the critic network's output.
- **Q(s, a)** is never represented. PPO only needs the *advantage* A(s, a) = Q(s, a) − V(s),
  and estimates it from the rewards actually collected (GAE, section 5).
- A DQN agent would do the opposite: learn Q(s, a) for all 8 actions and act greedily, with no
  separate policy network.

## 11. Results

### On synthetic graphs (does the method work at all?)

Graphs generated by `soren/data/synthetic.py`, with one planted vulnerable statement.

| Condition | PPO success | Best possible | PPO statements inspected | DFS statements inspected |
|---|---|---|---|---|
| Vulnerable statement clearly marked | 98.1% | 100% | 11.8 | 13.7 |
| Marker removed (nothing to learn) | 6.0% | 7.5% | 3.2 | 13.7 |

With a clear signal the agent finds the statement almost every time and looks at 14% fewer
statements than DFS. With the signal removed it falls to chance, which shows it is using the
features and nothing else. Source: `experiments/synthetic-validation.md`.

### On real BigVul functions (127 held-out test functions)

One declaration per function. Protocol B for the baselines.

| Method | Functions localized | 95% interval |
|---|---|---|
| DFS, stop at first suspicious statement | 27.6% | 19.7–35.4% |
| Line order, same rule | 27.6% | 19.7–35.4% |
| Heuristic-first, same rule | 26.8% | 19.7–34.6% |
| BFS, same rule | 25.2% | 18.1–33.1% |
| **PPO agent (5 seeds)** | **21.1%** | 15.3–27.4% |
| Random guess | 12.5% | |

The agent is clearly above a random guess. It is slightly below the simple baselines, and that
gap is not statistically significant on 127 functions (p = 0.14). With three declarations
allowed it reaches 40.7%, with five 48.0%. Source: `experiments/test/README.md`.

### Why it does not do better on real code

The classifier that sees every statement at once ranks a vulnerable one first only 23% of the
time, and adding CodeBERT embeddings does not change that
(`experiments/feature-signal.md`). The limit is what one statement's features reveal, not the
search policy: whether `memcpy(dst, src, len)` is a bug depends on whether `len` was checked
earlier, which no per-statement feature captures.

## 12. What was tried, what did not work, and why the current setup

Everything in this section was actually run; each row points to its record under
`experiments/`. Unless stated otherwise the numbers are success rates on the 128 validation
functions with one declaration, where a random guess scores 13.6%.

### The starting point

The first untuned run on real code (`experiments/bigvul-first-runs.md`) scored 18.8%, barely
above a random guess. The agent declared after about three actions and never searched: it
stood on a vulnerable statement at any point in only 26% of episodes. It also memorised:
47% on functions it trained on against 19% on new ones. The attempts below were all aimed at
those two problems.

### Attempts that did not help

| What was tried | The idea | What happened | Decision |
|---|---|---|---|
| **Harsher penalty for a wrong declaration** (−1.0 in place of −0.5) | Make guessing expensive so the agent searches longer | 18.8%. It still declared after 4 to 6 actions | Kept −0.5 |
| **Milder penalty** (−0.25) | Check the opposite direction | 18.0% | Kept −0.5 |
| **Cheaper steps** (−0.005 in place of −0.01) | Make a long search less costly | 18.0% | Kept −0.01 |
| **Harsher penalty and cheaper steps together** | Combine the two | 20.3%, the same as the unchanged default in that sweep | Kept the defaults |
| **More exploration** (entropy bonus 0.03) | Stop the policy settling on an early guess | 17.2%; 15.6% when combined with the harsher penalty | Kept 0.01 |
| **Smaller network** (128 × 128) | Less room to memorise training functions | 18.8%, and the gap between training and validation did not close | Kept 256 × 256 |
| **Reward shaping** (hints that pull the agent toward the labelled statement) | Give a learning signal before the final declaration | 15.9% against 16.9% without: slightly worse. The hint does not transfer when the features cannot identify the statement | Left off |
| **Structural features only** (17 numbers per statement) | See whether the code-content flags matter | 14.8% against 16.9% with them | Kept all 30 features |
| **CodeBERT embeddings added** (32 more numbers per statement) | A richer description of each statement | Agent 19.0% against 16.9%, within noise. The classifier's top-1 stayed at exactly 23.2%, while its training accuracy rose from 42% to 54%: more capacity to memorise, no new signal | Kept the 30 features; no pretrained model needed |
| **Backtrack disabled** | See whether the action earns its place | 18.5%: no change, because the agent rarely walks far enough to need it | Left on |
| **Revisit penalty removed** | Same check for the −0.02 | 18.2%: no change, for the same reason | Left on |

Sources: `experiments/sweep/README.md` (one seed per setting, 500,000 timesteps) and
`experiments/ablations/README.md` (three seeds per setting, 500,000 timesteps). On 128
functions one standard error is about 3.5 points, so none of these differences is real.
The eight reward and network settings ran from 15.6% to 20.3%, all within noise of one value.

A graph-size curriculum (start on small functions, add larger ones as success rises) was built
but left off: training does not stall on large functions, it levels off on all sizes.

### What did move the number

| What was tried | Result | Why it is not the headline |
|---|---|---|
| **Three declarations per function** | 40.4% | A random guess also rises, to 30.8% |
| **Five declarations per function** | 47.1% | A random guess rises to 41.7% |

The declare budget was the only change with an effect well outside the noise. The main result
still uses one declaration because it is the strictest reading of "find the vulnerable
statement"; the three- and five-declaration figures are reported next to it in section 11.

### Why the attempts failed: the cause was not the algorithm

A separate measurement explains all of the above (`experiments/feature-signal.md`). A
classifier that sees every statement of a function at once, with no walking and nothing
hidden, ranks a vulnerable statement first only 23% of the time. That is the ceiling for any
single declaration made from these features, and the agent with its one-step view sits just
under it. No reward, network size or exploration setting can lift a policy above what its
inputs reveal.

On synthetic graphs, where the vulnerable statement is clearly marked, the same agent with
the same settings reaches 98.1% (`experiments/synthetic-validation.md`). So the algorithm and
the environment work; the missing piece is information about the statement.

### Mistakes in how results were measured, and the fixes

| What was done first | What was wrong with it | What is done now |
|---|---|---|
| Baselines were stopped automatically on reaching a vulnerable statement (Protocol A) | They scored 100% by construction, which says nothing about whether they can find the statement | Baselines must declare by a threshold rule (Protocol B). The same baselines then score 25 to 28% |
| Validation success of the best checkpoint was read as the result | Agents trained on shuffled labels scored 17.7% on the labels their checkpoint was picked on, but 13.1% on fresh ones. Choosing the best of many evaluations on 128 functions adds about 4.5 points by itself | Only the test set, which no checkpoint or threshold was chosen on, is quoted as the result |
| Each function was parsed as C | Only 65% of functions produced a graph (70% when parsed as C++) | Each function is written both ways and whichever parses is kept: 97% |

### Planned but not done

- **DQN as a second learning algorithm.** The standard implementation has no action masking,
  so it needs a custom version. Not implemented.
- **A graph neural network over the whole function**, and **data-flow features** such as
  whether a length was checked before use. These address the actual limit and are the
  proposed next step.

### Why the current setup

| Choice | Reason |
|---|---|
| PPO with action masking | Stable, and a masked version exists ready-made (section 10). The sweep gives no reason to think another algorithm would do better on the same inputs |
| The default rewards and hyperparameters | Nothing tried improved on them beyond noise, so the simplest configuration was kept |
| 30 features per statement | Structural-only is worse, and embeddings add cost and memorisation without adding signal |
| One declaration as the headline | The strictest test; larger budgets are reported beside it |
| Protocol B baselines and test-set-only reporting | The two measurement fixes above |

## 13. Innovation, with evidence

Each claim below points to something in the repository that can be checked.

### 1. Vulnerability localization reformulated as graph navigation

The usual formulation is classification: score every statement or the whole function in one
pass. Soren models it as a sequential decision process on the control flow graph, which makes
it a reinforcement learning problem and makes the reasoning replayable.

- **Evidence it works:** 98.1% success on synthetic graphs while inspecting 14% fewer
  statements than DFS (`experiments/synthetic-validation.md`).
- **Evidence it is interpretable:** every episode is a recorded sequence of actions with the
  policy's probabilities, replayable in `web-app/`.
- **Where:** `soren/env/cfg_nav_env.py`.

We did not find prior work that trains an agent to walk a control flow graph to localize a
vulnerability, but this was not a systematic survey.

### 2. A Gymnasium environment for walking program graphs

A reusable environment with a fixed-size action space over variable-degree graphs,
invalid-action masking, a one-hop observation, a declare budget, and potential-based reward
shaping as an option.

- **Evidence:** passes Gymnasium's own `check_env`; 25 tests in `tests/test_env.py`, including
  one that checks the mask against an independent rule over every action sequence up to
  length 7.
- **Where:** `soren/env/`.

### 3. Two evaluation protocols that expose an unfair comparison

Comparing a learned agent with BFS and DFS is misleading if the baselines are simply stopped
when they reach the answer. Soren reports both that protocol and one where baselines must
declare.

- **Evidence:** the same baselines score 99–100% under the oracle stop and 25–28% when they
  must declare (`experiments/test/README.md`). The fair numbers are the second set.
- **Where:** `soren/baselines/base.py:38`, `soren/baselines/heuristic.py:77`.

### 4. Controls that caught a bias in our own results

Two controls check that the agent is not reading the answer from somewhere it should not.
One of them exposed a flaw in how validation results are usually reported.

- **Evidence:** permuting statement IDs leaves every checkpoint's score exactly unchanged.
  Agents trained on shuffled labels score chance (13.1% against 13.6%) on fresh labels, but
  17.7% on the labels their checkpoint was selected on. Picking the best of ten evaluations on
  128 functions inflates a score by about 4.5 points
  (`experiments/leakage/README.md`).
- **Consequence:** only the untouched test set is quoted as the result.
- **Where:** `soren/data/transform.py` (`shuffle_labels`, `permute_node_ids`).

### 5. A measured explanation of the limit

Instead of stopping at "the agent does not beat the baselines", the project measures why.

- **Evidence:** a classifier with full visibility reaches 23.2% top-1 with lexical features
  and 23.2% with CodeBERT embeddings added; a sweep of eight reward and hyperparameter
  settings all land within noise of each other
  (`experiments/feature-signal.md`, `experiments/sweep/README.md`).
- **Conclusion:** the bottleneck is the per-statement representation, not the RL algorithm.

### 6. Parsing C and C++ together

BigVul mixes C and C++, and the parser (Joern) chooses its grammar by file extension. A C++
method parsed as C yields nothing.

- **Evidence:** parsing as C alone recovers 65% of functions; as C++ alone 70%; writing each
  function both ways and keeping whichever parses recovers **97%** (1,525 of 1,578).
- **Where:** `soren/data/sources.py`, `soren/data/cfg_builder.py:306` (`select_method`).

### 7. Line-level control flow graphs with verified labels

Joern produces one node per expression. Soren collapses these to one node per source line,
merges multi-line statements, and checks every label against the source text so that an
off-by-one index cannot silently label the wrong line.

- **Evidence:** golden tests assert exact edges for hand-written C snippets parsed by real
  Joern (`tests/test_cfg_builder.py`, `tests/fixtures/joern/`).
- **Where:** `soren/data/cfg_builder.py:116`, `soren/data/labels.py`.

<script type="application/json" id="glossary">[{"title": "PPO (Proximal Policy Optimization)", "terms": ["Proximal Policy Optimization (PPO)", "Proximal Policy Optimization", "PPO"], "cs": true, "tip": "The learning algorithm that trains the agent. Loop: play for a while, score each action as better or worse than expected, then nudge the policy so good actions get more likely.\nIts key rule: each update may only move the policy a small distance from the old one.\nChosen because it is stable, reuses each batch several times, and has a ready-made version with action masking."}, {"title": "Proximal = \"stay close\"", "terms": ["\"proximal\"", "proximal"], "tip": "Each update must stay close to the previous policy. Here: if an update would change an action's probability by more than 20%, the extra gain is ignored.\nWhy: one batch of lucky or unlucky episodes could otherwise make the agent change drastically and wreck what it already learned."}, {"title": "The clip", "terms": ["The clip", "clip_range", "clipped surrogate objective", "clipped objective"], "tip": "The cap that makes PPO \"proximal\". The ratio new probability / old probability is limited to the range 0.8 to 1.2 (ε = 0.2). Any gain from moving further than that is ignored, so the policy changes in small, safe steps."}, {"title": "MaskablePPO", "terms": ["MaskablePPO"], "cs": true, "tip": "Ordinary PPO plus one feature: before choosing, it removes the actions that are impossible right now. Comes from the sb3-contrib library, so nothing custom had to be written."}, {"title": "sb3-contrib", "terms": ["sb3-contrib"], "cs": true, "tip": "An add-on package for Stable-Baselines3, a standard Python library of reinforcement learning algorithms. It provides MaskablePPO."}, {"title": "Action masking", "terms": ["Action masking", "action masking", "invalid-action masking", "invalid-action masks", "Valid-action mask", "Mask invalid actions"], "tip": "Tells the agent which actions are possible, not which are good.\nThe network always has 8 action slots, but a statement with 2 next statements has 4 empty move slots. Masking forces those to probability zero.\nIt is not cheating: it uses only the graph's shape, never the answer. It just saves the agent from learning \"this button does nothing here\"."}, {"title": "Why 8 actions", "terms": ["Eight discrete actions", "8 discrete actions", "8 actions", "8 action probabilities"], "tip": "There are 3 kinds of action (move, backtrack, declare), but \"move\" needs to say which next statement, and an if or switch has several.\n6 move slots + backtrack + declare = 8.\n6 is a chosen maximum, because a network needs a fixed number of outputs. Most slots are empty at any moment and get masked."}, {"title": "MOVE_i", "terms": ["MOVE_i"], "cs": true, "tip": "Six separate actions, MOVE_0 to MOVE_5: go to the 1st, 2nd, ... 6th next statement, in line order. An ordinary line uses only MOVE_0; an if uses MOVE_0 and MOVE_1."}, {"title": "BACKTRACK", "terms": ["BACKTRACK"], "cs": true, "tip": "Go back to the statement the agent came from. Not possible at the function's entry, so it is masked there."}, {"title": "DECLARE", "terms": ["DECLARE"], "cs": true, "tip": "The agent's final answer: \"the statement I am standing on is the vulnerable one\". +1.0 if right, −0.5 if wrong, and the episode ends."}, {"title": "Why 248 numbers", "terms": ["observation of 248 numbers", "248-number observation", "observe 248 numbers", "248 numbers", "248-number", "248"], "tip": "What the agent sees at each step, as a fixed-length list. Every number is between 0 and 1.\n30 current statement\n+ 2 visit info for it\n+ 198 six next-statement slots (6 × 33)\n+ 13 backtrack target\n+ 5 episode context\n= 248\nIt never sees the code text, anything more than one step away, or the answer."}, {"title": "The 30 features of one statement", "terms": ["30 per-statement features", "30 numbers per statement", "its 30 features", "30 features", "per-statement feature", "per-statement representation"], "tip": "A \"card\" describing one statement.\n11 flags: what kind it is (assignment, call, branch, loop, ...).\n6 numbers: where it sits (edges in, edges out, depth, in a loop, loop header, line position).\n13 numbers: what the code contains (dangerous call, array index, pointer use, arithmetic, sizeof, length-like variable, ...).\n11 + 6 + 13 = 30."}, {"title": "Six successor slots (198 numbers)", "terms": ["Six successor slots", "successor slots", "6 × 33 = 198", "\"slot used\" flag"], "tip": "One slot for each possible next statement, 6 slots at most. Each slot is 33 numbers: 1 \"slot in use\" flag + the statement's 30 features + 1 \"visited before\" + 1 \"jumps back to a loop top\".\nUnused slots are all zeros. 6 × 33 = 198."}, {"title": "Backtrack target (13 numbers)", "terms": ["Backtrack target"], "tip": "A short summary of the statement the agent would return to: 1 flag for \"backtracking is possible\", 1 number for how often it was visited, and 11 flags for its kind. 1 + 1 + 11 = 13."}, {"title": "Episode context (5 numbers)", "terms": ["Episode context"], "tip": "Five progress numbers: fraction of the step budget used, fraction of the function visited, how deep the current path is, how big the function is, and declarations left."}, {"title": "Structural features (17)", "terms": ["Structural (17)", "Structural features"], "tip": "Facts about a statement's place in the graph, not its text: its kind (11 flags), how many edges come in and go out, distance from the entry, inside a loop, top of a loop, and line position."}, {"title": "Lexical features (13)", "terms": ["Lexical (13)", "Lexical features", "lexical features", "lexical flags"], "tip": "Facts read from the statement's text by simple pattern checks: does it call a function, call a dangerous one, allocate, free, index an array, use a pointer, do arithmetic, compare, use sizeof, cast, mention a length-like variable, and how long it is."}, {"title": "One-hot", "terms": ["one-hot"], "tip": "A way to write a category as numbers: one flag per possible kind, with exactly one set to 1 and the rest 0. Here, 11 flags for the 11 statement kinds."}, {"title": "In-degree and out-degree", "terms": ["in-degree", "out-degree", "variable-degree"], "tip": "In-degree: how many statements can lead into this one. Out-degree: how many statements it can lead to. An if has out-degree 2."}, {"title": "Back edge and loop header", "terms": ["loop back edge", "back edge", "loop header"], "tip": "A back edge is the arrow that jumps from the end of a loop body back to the top. The statement it lands on is the loop header."}, {"title": "Dangerous API", "terms": ["dangerous API", "dangerous call"], "tip": "A fixed list of C functions that often cause memory bugs when misused, such as memcpy, strcpy, sprintf, gets and read. The agent only sees a yes/no flag for \"calls one of these\"."}, {"title": "Successor", "terms": ["successors", "successor"], "tip": "A statement that can run directly after the current one. An ordinary line has one successor; an if has two (true branch and false branch); a switch can have several."}, {"title": "Statement = node", "terms": ["one node per source line", "nodes", "node"], "tip": "One box in the graph. In Soren, one node is one line of source code (plus special ENTRY and EXIT nodes)."}, {"title": "ENTRY and EXIT", "terms": ["ENTRY", "EXIT"], "cs": true, "tip": "Two artificial nodes added to every function: ENTRY is where the walk starts, EXIT is where the function ends. They are not real code, so the agent cannot declare them."}, {"title": "Control flow graph (CFG)", "terms": ["control flow graphs", "control flow graph", "CFG"], "tip": "A function drawn as a map: each statement is a box, and an arrow from A to B means \"B can run right after A\". The agent walks along these arrows."}, {"title": "Environment (the \"game\")", "terms": ["Gymnasium environment", "Environment class", "Environment", "environment"], "tip": "The task the agent plays through and gets scored on. In Soren: one vulnerable function as a graph. The agent starts at the entry, moves, backtracks or declares, and receives a reward for each step."}, {"title": "CFGNavEnv", "terms": ["CFGNavEnv.step()", "CFGNavEnv.reset", "CFGNavEnv"], "cs": true, "tip": "The Python class that implements Soren's environment. reset() starts a walk on a random function; step(action) applies one action and returns the new observation and the reward."}, {"title": "Gymnasium", "terms": ["Gymnasium", "check_env"], "cs": true, "tip": "The standard Python interface for reinforcement learning environments (reset and step). Following it lets off-the-shelf algorithms like PPO plug straight in. check_env is its built-in test that an environment follows the rules."}, {"title": "16 parallel environments", "terms": ["16 environments", "Parallel environments", "16 environments × 512 steps"], "tip": "16 copies of the walk running side by side, not 16 fixed functions. Each copy picks a random training function at the start of every episode and a new one when it ends.\nWhy: experience is collected faster, and each update sees a mix of functions, which makes learning steadier."}, {"title": "Episode", "terms": ["Episode", "episodes", "episode"], "tip": "One complete attempt on one function: from ENTRY until the agent declares or runs out of steps."}, {"title": "Step budget", "terms": ["Step budget exhausted", "step budget", "out of steps", "timeout"], "tip": "The maximum number of actions per episode: min(200, 4 × number of statements). Running out costs −0.5, the same as a wrong declaration, so wandering forever is not a safe option."}, {"title": "Declare budget", "terms": ["declare budget", "declarations left", "One declaration per function", "three declarations"], "tip": "How many guesses the agent gets per function. The main results allow one. With three guesses the agent reaches 40.7%, with five 48.0%."}, {"title": "Markov decision process (MDP)", "terms": ["Markov decision process", "MDP"], "tip": "The standard way to write down a reinforcement learning problem: the states you can be in, the actions you can take, where each action leads, the reward you get, and when it ends."}, {"title": "State vs observation", "terms": ["true state", "State s", "Observation", "observation"], "tip": "State: the full truth of the situation (position, path, everything visited). Observation: the part the agent is actually shown, here 248 numbers about the current statement and its direct neighbours."}, {"title": "Partially observable", "terms": ["partially observable", "one-hop observation", "one step ahead"], "tip": "The agent does not see the whole function, only the current statement and the ones directly after it. It is like walking a maze with a torch instead of a map."}, {"title": "Recurrent", "terms": ["recurrent"], "tip": "A network with built-in memory of earlier steps. Soren avoids needing one by putting simple memory into the observation itself (the \"visited before\" flags)."}, {"title": "Deterministic", "terms": ["Deterministic"], "tip": "No randomness in the environment: taking the same action from the same statement always lands in the same place."}, {"title": "Reward", "terms": ["Reward r", "reward r", "Reward", "rewards", "reward"], "tip": "The score for one step. −0.01 per move (so short walks are better), a further −0.02 for stepping onto a visited statement, +1.0 for a correct declaration, −0.5 for a wrong one or for running out of steps."}, {"title": "Return", "terms": ["Return G", "Return", "returns", "return"], "tip": "The total of all rewards in one episode. Example: two moves and a correct declaration = −0.01 − 0.01 + 1.0 = +0.98. The agent is trained to make this as large as possible."}, {"title": "Policy π(a | s)", "terms": ["Policy π(a | s)", "π(a | s)", "π_θ(a | s)", "π_θ(· | s_t)", "Policy", "policy"], "tip": "The agent's rule for acting: given the situation s, the probability of choosing each action a. In Soren the policy is the actor network. θ just means \"the actor's weights\"."}, {"title": "Actor", "terms": ["Actor (policy network)", "actor network", "the actor", "Actor", "actor"], "tip": "The network that answers \"what should I do next?\". It reads the 248 numbers and outputs a score for each of the 8 actions, which become probabilities."}, {"title": "Critic", "terms": ["Critic (value network)", "critic network", "the critic", "Critic", "critic"], "tip": "The network that answers \"how well is this going?\". It reads the same 248 numbers and outputs one number: the reward it expects from here on. It never picks actions; it only helps training judge whether an action beat expectations."}, {"title": "V(s): state value", "terms": ["State value V(s)", "Value V(s)", "V(s)", "V_φ(s)", "V_φ(s_t)", "value function", "Value estimate"], "cs": true, "tip": "The critic's prediction: \"from this spot, how much total reward do I expect to collect?\" φ just means \"the critic's weights\"."}, {"title": "Q(s, a): action value", "terms": ["Action value Q(s, a)", "Q(s, a)", "Q(s_t, a_t)"], "cs": true, "tip": "\"If I take action a from here, how much total reward do I expect?\" Soren never learns this directly. PPO only needs the advantage, Q − V, which it estimates from the rewards actually collected."}, {"title": "Advantage", "terms": ["Advantage A(s, a)", "A(s, a)", "advantages", "advantage", "Advantage"], "tip": "Not the result itself, but the result compared with what was expected.\nAdvantage = what actually happened after the action − what the critic expected from that spot.\nPositive: better than expected, make it more likely. Negative: worse, make it less likely.\nExample: critic expected +0.2, the walk ended at +0.9, advantage ≈ +0.7."}, {"title": "GAE (Generalized Advantage Estimation)", "terms": ["Generalized Advantage Estimate", "GAE", "gae_lambda"], "cs": true, "tip": "The method for calculating the advantage. Looking one step ahead is steady but trusts the critic's possibly wrong guess; looking to the end of the episode uses real rewards but is noisy. GAE blends the two with a knob λ (here 0.95, leaning towards the long view)."}, {"title": "TD error: the one-step surprise", "terms": ["one-step surprise", "TD error", "δ_t"], "tip": "\"Did this single step go better or worse than the critic predicted?\"\nreward received + critic's estimate of the new spot − critic's estimate of the old spot.\nZero means exactly as expected."}, {"title": "γ (gamma): discount", "terms": ["γ = 0.99", "gamma", "γ"], "cs": true, "tip": "How much a reward one step later is worth compared with one now. 0.99 means future rewards count almost fully, with a slight preference for sooner."}, {"title": "λ (lambda): the GAE knob", "terms": ["λ = 0.95", "λ"], "cs": true, "tip": "Between 0 and 1. Near 0: trust the short one-step view (less noise, more reliance on the critic). Near 1: trust the long view of real rewards (more noise). 0.95 is a common middle choice."}, {"title": "Value target R_t", "terms": ["value target", "value targets", "R_t"], "cs": true, "tip": "What the critic should have predicted for that step, worked out after the fact: the advantage plus the critic's own old guess. The critic is trained to move its predictions towards these."}, {"title": "Probability ratio ρ", "terms": ["probability ratio", "ρ_t(θ)", "ρ_t"], "tip": "New probability of the action ÷ old probability of the same action. 1.0 means unchanged; 1.2 means the update made the action 20% more likely. PPO limits this to 0.8–1.2."}, {"title": "ε (epsilon): clip size", "terms": ["ε = 0.2", "ε"], "cs": true, "tip": "How far one update may move an action's probability: 0.2 means at most 20% up or down. This is the \"proximal\" limit."}, {"title": "Loss", "terms": ["Total loss minimised", "Total loss", "loss"], "tip": "A single number saying how wrong the networks currently are. Training means changing the weights to make it smaller.\nL = policy loss + 0.5 × value loss − 0.01 × entropy.\nThe policy part improves the actor, the value part fixes the critic at half weight, and the minus sign on entropy gently rewards exploring."}, {"title": "Policy (actor) loss", "terms": ["Policy (actor) loss", "L_policy"], "cs": true, "tip": "The part of the loss that improves the actor: make actions with positive advantage more likely and those with negative advantage less likely, but never by more than the clip allows."}, {"title": "Value (critic) loss", "terms": ["Value (critic) loss", "L_value"], "cs": true, "tip": "How wrong the critic's guesses were: the gap between what it predicted and what really happened, squared and averaged. Shrinking it makes the critic a better predictor, which makes the advantages more accurate."}, {"title": "Entropy bonus", "terms": ["Entropy bonus", "entropy bonus", "entropy of", "entropy", "ent_coef"], "tip": "Entropy measures how spread out the agent's choices are: low if it picks one action 99% of the time, high if it still tries several. A small reward for high entropy keeps the agent exploring instead of locking onto the first habit that worked."}, {"title": "H", "terms": ["H"], "cs": true, "formula": true, "tip": "The average entropy of the policy over the batch: how undecided the agent is. Higher means more exploring."}, {"title": "vf_coef", "terms": ["vf_coef"], "cs": true, "tip": "The weight of the critic's loss in the total loss: 0.5, so fixing the critic counts half as much as improving the actor."}, {"title": "Gradient", "terms": ["Gradients", "gradients", "gradient descent", "gradient"], "tip": "For every weight, the direction that would reduce the loss. Gradient descent means repeatedly taking a small step in that direction."}, {"title": "Backpropagation", "terms": ["backpropagation"], "tip": "The procedure that works out, for every weight in the network, which way to change it to reduce the loss. It works backwards from the output layer to the input layer."}, {"title": "Gradient clipping", "terms": ["clipped to a norm of", "max_grad_norm"], "tip": "If the suggested change to the weights is too large overall, it is scaled down to a maximum size of 0.5. A second safety cap, separate from PPO's clip, against one bad batch causing a wild jump."}, {"title": "Adam optimiser", "terms": ["Adam"], "cs": true, "tip": "The method that actually changes the weights. Backpropagation gives the direction; Adam decides how big a step each weight takes. It remembers recent directions (momentum) and gives each weight its own step size. It is the standard default, nothing custom."}, {"title": "Learning rate", "terms": ["learning rate 3 × 10⁻⁴", "Learning-rate schedule", "learning rate", "learning_rate"], "tip": "The overall step size for weight updates. It starts at 0.0003 and shrinks steadily to zero, so early changes are larger and late ones are fine adjustments."}, {"title": "Logits", "terms": ["logits"], "tip": "The raw scores the actor outputs, one per action, before they are turned into probabilities. They can be any number, positive or negative; a higher score means a more preferred action."}, {"title": "Softmax", "terms": ["softmax"], "tip": "The function that turns raw scores into probabilities: all positive and adding up to 100%, with higher scores getting the larger share."}, {"title": "Sampling vs most probable", "terms": ["Sampling from the policy", "sampled", "sampling", "samples"], "tip": "Picking an action at random according to the probabilities, so a 70% action is chosen about 70% of the time. Used in training so the agent tries things. At test time it simply takes the most probable valid action."}, {"title": "Multilayer perceptron (MLP)", "terms": ["multilayer perceptrons", "plain MLP", "MlpPolicy", "MLP"], "tip": "The simplest kind of neural network: a stack of layers where every output of a layer is a weighted sum of all its inputs. Soren uses 3 layers per network: 248 → 256 → 256 → output."}, {"title": "tanh", "terms": ["tanh"], "cs": true, "tip": "A function applied after each hidden layer that squashes every number into the range −1 to 1. Without it, three stacked layers would behave like one weighted sum and could not learn combinations of features."}, {"title": "Linear layer", "terms": ["Linear 248 → 256", "Linear 256 → 256", "Linear 256 → 8", "Linear 256 → 1", "hidden layer", "no shared layers"], "tip": "One layer of the network: every output number is a weighted sum of all input numbers. \"248 → 256\" means 248 numbers in, 256 out. The weights are what training adjusts. \"No shared layers\" means actor and critic are fully separate networks."}, {"title": "Parameters (weights)", "terms": ["261,385", "Parameters", "weights"], "tip": "The adjustable numbers inside the networks; learning means changing them. Soren has 261,385 in total, which is tiny (a modern language model has billions)."}, {"title": "Graph neural network (GNN)", "terms": ["graph neural networks", "graph neural network", "GNN", "graph encoder"], "tip": "A network designed to read a whole graph at once. Soren does not use one: its agent sees only a fixed-length summary of the local neighbourhood, so a plain network is enough. Listed as future work."}, {"title": "Policy-gradient", "terms": ["policy-gradient"], "tip": "A family of methods that learn the policy directly: try actions, then shift probabilities towards the ones that turned out well."}, {"title": "Actor-critic", "terms": ["actor-critic"], "tip": "A method with two parts: an actor that chooses actions and a critic that estimates how good the situation is. The critic's estimate makes the actor's learning signal much less noisy."}, {"title": "Model-free", "terms": ["model-free", "Model of the environment"], "tip": "The agent does not plan by imagining future steps. It learns by trying things and seeing the rewards, then acts directly from what it has learned."}, {"title": "On-policy", "terms": ["On-policy / off-policy", "On-policy", "on-policy"], "tip": "The agent learns only from experience collected by its current policy. Once a batch has been used for its update, it is thrown away and fresh experience is collected."}, {"title": "Exploration", "terms": ["Exploration", "exploring"], "tip": "Trying actions that do not currently look best, in case they turn out better. Without it the agent would lock onto its first working habit."}, {"title": "Deep RL", "terms": ["Deep RL", "deep RL"], "tip": "Reinforcement learning where the policy and value function are neural networks rather than lookup tables."}, {"title": "Transition", "terms": ["8,192 transitions", "Transitions per rollout", "(s, a, r, s′)", "transitions", "transition"], "tip": "One recorded step: the situation (s), the action taken (a), the reward received (r) and the new situation (s′). 16 environments × 512 steps = 8,192 of them per round."}, {"title": "Rollout", "terms": ["Rollout", "rollouts", "rollout", "collect experience", "batch of experience"], "tip": "One round of data collection: the current policy plays 512 steps in each of 16 environments, giving 8,192 transitions. Then the networks are updated and a new rollout starts."}, {"title": "Epochs and minibatches", "terms": ["10 epochs over the rollout", "Passes over each rollout", "10 passes over each rollout", "Minibatch size", "minibatches of 512", "n_epochs", "batch_size"], "tip": "The 8,192 transitions of a rollout are split into 16 minibatches of 512, and each minibatch produces one weight update. The whole set is gone through 10 times (10 epochs). 16 × 10 = 160 updates per rollout."}, {"title": "Gradient step", "terms": ["160 gradient steps", "Gradient steps per rollout", "Total gradient steps", "gradient step"], "tip": "One actual update of the weights, computed from one minibatch of 512 transitions. 160 per rollout, about 19,700 in a full training run."}, {"title": "Timesteps", "terms": ["Total timesteps", "timesteps", "n_steps"], "tip": "A count of single actions taken across all environments. 1,000,000 timesteps means the agent took about a million actions during training."}, {"title": "Checkpoint", "terms": ["best_model.zip", "checkpoint", "Choosing the checkpoint"], "tip": "A saved copy of the networks' weights. Every 50,000 timesteps the agent is tested on the validation functions, and the best-scoring copy is kept, not simply the last one."}, {"title": "Train / validation / test", "terms": ["1,023 / 128 / 127", "validation functions", "Validation evaluations", "validation", "test set", "held-out test functions", "Training functions"], "tip": "Three separate sets of functions. Training (1,023): what the agent learns from. Validation (128): used during training to pick the best checkpoint. Test (127): never touched until the very end, so its score is an honest measure on unseen code."}, {"title": "Seeds", "terms": ["5 independent runs", "5 seeds", "Seeds", "seed"], "tip": "The starting number for the random generator. Training involves randomness, so it is repeated 5 times with different seeds and the results are averaged. That shows the result is not a lucky one-off."}, {"title": "Reward normalisation", "terms": ["normalised reward units", "normalised by a running", "VecNormalize"], "tip": "During training, rewards are rescaled to a consistent size so learning is steadier. A side effect: the critic's value estimates are in these rescaled units, which is why they can be above 1."}, {"title": "Baselines", "terms": ["Baselines", "baselines", "non-learning methods", "Non-learning search methods"], "tip": "Simple fixed-rule methods the agent is compared against. They do not learn: no rewards, no networks. If a learned agent cannot beat them, the learning is not adding much."}, {"title": "Depth-first search (DFS)", "terms": ["Depth-first search (DFS)", "DFS"], "cs": true, "tip": "Keep following the first unvisited next statement as deep as it goes; when stuck, back up and try the next branch."}, {"title": "Breadth-first search (BFS)", "terms": ["Breadth-first search (BFS)", "BFS"], "cs": true, "tip": "Look at everything one step from the entry, then everything two steps away, and so on outward."}, {"title": "Heuristic-first", "terms": ["Heuristic-first", "heuristic-first"], "tip": "Always go next to the reachable statement that looks most suspicious according to a hand-written score. A strong baseline because it uses the same flags the agent sees."}, {"title": "Suspicion score", "terms": ["suspicion score", "Suspicion score", "suspicion\n  score"], "tip": "A hand-written number for how risky a statement looks: dangerous call 3, array subscript 2, pointer arithmetic 2, pointer dereference 1, allocation 1, length-like variable 1, arithmetic 0.5, added up and scaled to 0–1. No learning involved."}, {"title": "Protocol A: oracle stop", "terms": ["Protocol A (oracle stop).", "Protocol A", "oracle stop", "Oracle stop", "stopped\nwhen they reach the answer"], "tip": "The baseline is stopped automatically the moment it steps on a vulnerable statement, so it effectively knows the answer and cannot be wrong. It only measures how many statements it looked at. Unfair to compare with the agent, which must decide for itself."}, {"title": "Protocol B: must declare", "terms": ["Protocol B (must declare).", "Protocol B", "must declare", "same rule", "stop at first suspicious statement", "Threshold stop"], "tip": "The baseline is not told the answer. It walks in its usual order and declares at the first statement whose suspicion score reaches a threshold, so it can be wrong, just like the agent. This is the fair comparison."}, {"title": "Threshold", "terms": ["threshold"], "tip": "The cut-off suspicion score at which a baseline declares. It was tuned on the validation functions, never on the test set."}, {"title": "Classifier (supervised reference)", "terms": ["Node classifier", "small classifier", "classifier", "supervised"], "tip": "A model shown every statement of a function at once, with the correct labels during training, and asked to rank them. Not a search. It measures the most that the 30 features can reveal when nothing is hidden."}, {"title": "Top-1", "terms": ["top-1", "ranks a vulnerable one first"], "tip": "How often the single highest-ranked statement is actually vulnerable."}, {"title": "Random guess (chance)", "terms": ["Random guess", "random guess", "chance"], "tip": "The success rate from declaring a statement picked at random: 12.5% on the test functions. Anything a method scores has to be judged against this floor."}, {"title": "95% interval", "terms": ["95% interval", "confidence intervals", "Confidence intervals"], "tip": "The range the true success rate plausibly lies in, given only 127 test functions. Wide, overlapping ranges mean two methods cannot be confidently told apart."}, {"title": "Statistically significant", "terms": ["not statistically significant", "p = 0.14", "within noise"], "tip": "A gap is significant when it is too large to be explained by luck. p = 0.14 means a gap this size would appear about 14% of the time by chance alone, which is not rare enough (the usual bar is 5%). So the agent and the baselines are not reliably different."}, {"title": "Why MCTS does not fit", "terms": ["Monte Carlo Tree Search", "Planning / MCTS", "MCTS / AlphaZero", "MCTS", "tree search", "search tree"], "tip": "MCTS picks a move by imagining many futures and checking how each scores. Soren can imagine the moves (the graph is known) but not the score: on a new function nobody knows whether a declaration is right, which is the very thing being asked. In chess the rules tell you who won; here the \"who won\" is hidden."}, {"title": "AlphaZero", "terms": ["AlphaZero"], "cs": true, "tip": "Tree search combined with a learned network that guesses how promising each position is, so the search does not need the true score. A possible extension for Soren, but more to build than PPO."}, {"title": "DQN", "terms": ["DQN"], "cs": true, "tip": "An algorithm that learns a score Q for every action and always picks the highest, with no separate policy network. Not used: the standard version has no action masking, so it would need custom work."}, {"title": "A2C / A3C", "terms": ["A2C / A3C"], "cs": true, "tip": "Earlier actor-critic algorithms from the same family as PPO. They lack the clip, so they are less stable, and they use each batch only once."}, {"title": "TRPO", "terms": ["TRPO"], "cs": true, "tip": "PPO's predecessor. It enforces the same \"stay close\" idea with a strict mathematical limit and heavier computation; PPO gets similar results more simply."}, {"title": "REINFORCE", "terms": ["REINFORCE"], "cs": true, "tip": "The simplest policy-gradient algorithm: no critic, it judges actions by the whole episode's return. Simple but very noisy."}, {"title": "High variance", "terms": ["High variance"], "tip": "The learning signal jumps around a lot from one episode to the next, because lots of random things affect the final score. Noisy signals make learning slow and unstable."}, {"title": "Acting greedily", "terms": ["act greedily", "picking the largest Q"], "tip": "Always choosing the action with the highest score, with no randomness."}, {"title": "BigVul", "terms": ["BigVul dataset", "BigVul"], "cs": true, "tip": "A public dataset of real C and C++ functions from open-source projects, each linked to a known vulnerability (CVE) and the commit that fixed it."}, {"title": "CWE-119 and CWE-125", "terms": ["CWE-119/125", "CWE-119", "CWE-125"], "cs": true, "tip": "Standard vulnerability categories. CWE-119: operations outside the bounds of a memory buffer (e.g. buffer overflow). CWE-125: reading past the end of a buffer. Soren uses only these two kinds."}, {"title": "Ground truth", "terms": ["ground truth", "vulnerable nodes", "labels", "Label alignment"], "tip": "The \"correct answer\" used for scoring: the lines that the fixing commit removed or rewrote. It is a proxy, since a fix can also touch lines that were not themselves the bug."}, {"title": "Joern", "terms": ["Joern"], "cs": true, "tip": "An open-source code analysis tool. Soren uses it to parse each C/C++ function and produce its control flow graph."}, {"title": "GraphRecord", "terms": ["GraphRecord files", "GraphRecord", "Graph record format", "Shared record"], "cs": true, "tip": "The single data format everything downstream reads: one function with its nodes, edges, vulnerable nodes and source lines."}, {"title": "Split by fixing commit", "terms": ["Split by fixing commit", "Commit-level split"], "tip": "Functions fixed by the same commit always go into the same set (train, validation or test). Otherwise near-identical functions could appear in both training and test and inflate the score."}, {"title": "Synthetic graphs", "terms": ["synthetic graphs", "Synthetic graphs", "Synthetic validation"], "tip": "Artificial, generated graphs with one planted vulnerable statement. Used to check that the method works at all before trying real code, where the signal is much weaker."}, {"title": "Reward shaping", "terms": ["potential-based reward\nshaping", "potential-based shaping", "unshaped reward"], "tip": "Optional extra hints added to the reward during training to speed up learning, done in a way that does not change which behaviour is best. Off by default; \"unshaped\" is the plain reward from the table."}, {"title": "Hyperparameters", "terms": ["hyperparameter", "Hyperparameter", "hyperparameters"], "tip": "Settings chosen by people before training, not learned: learning rate, number of environments, clip size and so on. They live in configs/ppo.yaml."}, {"title": "Sweep", "terms": ["sweep", "Ablations"], "tip": "Running training several times with different settings to see whether any choice matters. Here eight settings all gave about the same result, which points to the features, not the algorithm, as the limit. An ablation removes one piece to see how much it was contributing."}, {"title": "CodeBERT embeddings", "terms": ["CodeBERT embeddings", "CodeBERT"], "cs": true, "tip": "A richer description of each statement produced by a pretrained language model for code. Adding it did not improve the classifier, which suggests the limit is looking at one statement at a time, not how it is described."}, {"title": "Leakage controls", "terms": ["shuffled labels", "permuting statement IDs", "Leakage controls"], "tip": "Checks that the agent is not getting the answer from somewhere it should not. Shuffled labels: train on wrong answers, which should give chance-level scores. Permuted IDs: renumber the statements, which should change nothing."}, {"title": "Golden tests", "terms": ["golden tests"], "tip": "Tests that compare the program's output with a hand-checked correct answer stored in the repository."}, {"title": "Overfitting (memorising)", "terms": ["overfits", "overfit", "memorised", "memorising", "memorise", "memorisation"], "tip": "Doing well on the examples seen in training but not on new ones. Here: 56% on training functions against about 20% on unseen ones. The agent has partly learned to recognise specific functions, not a general skill."}, {"title": "Explained variance", "terms": ["Explained variance of the critic", "explained variance"], "tip": "How well the critic's predictions match what actually happened. 0 means no better than guessing the average; 1 means perfect. Rising from 0 to 0.72 shows the critic is learning."}, {"title": "Approximate KL", "terms": ["Approximate KL per update", "KL"], "cs": true, "tip": "A measure of how far one update moved the policy from the previous one. Small values (below about 0.02) mean gentle, safe updates, which is what PPO aims for."}, {"title": "Clip fraction", "terms": ["Clip fraction", "clip\n  fraction"], "tip": "The share of training samples where the update tried to move an action's probability by more than the 20% limit and was cut off. A few percent is normal; a large share would mean the updates are too aggressive."}, {"title": "Policy entropy", "terms": ["Policy entropy"], "tip": "How undecided the agent is, averaged over training steps. High early on (it tries many actions), low later (it has settled on what to do). 0 would mean it always picks one action with certainty."}, {"title": "Standard error", "terms": ["standard error"], "tip": "How much a measured percentage would wobble if the experiment were repeated on a different sample of the same size. Differences smaller than about two standard errors cannot be told apart from luck."}, {"title": "Curriculum", "terms": ["graph-size curriculum", "curriculum"], "tip": "Training on easy cases first (small functions) and adding harder ones as the agent improves. Built but not used here, because training was not getting stuck on large functions."}, {"title": "Throughput", "terms": ["timesteps per second"], "tip": "How fast training runs: the number of agent actions simulated and learned from each second."}]</script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script>
// Heading ids in the same style GitHub uses, so the document's own contents links work.
const slug = (text) => text.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\w\- ]/g, "").trim().replace(/ /g, "-");

const renderer = new marked.Renderer();
renderer.heading = (text, level, raw) => `<h${level} id="${slug(raw)}">${text}</h${level}>\n`;
renderer.code = (code, lang) => {
  const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  if (lang === "mermaid") return `<div class="diagram mermaid">${escape(code)}</div>`;
  const known = lang && hljs.getLanguage(lang);
  const html = known ? hljs.highlight(code, { language: lang }).value : escape(code);
  const label = lang ? `<span class="code-lang">${lang}</span>` : "";
  return `<pre>${label}<code class="hljs">${html}</code></pre>`;
};

const content = document.getElementById("content");
content.innerHTML = marked.parse(document.getElementById("source").textContent, { renderer, gfm: true });

// The sidebar replaces the inline contents list.
const inline = document.getElementById("contents");
if (inline) {
  let node = inline.nextElementSibling;
  while (node && node.tagName !== "H2") { const next = node.nextElementSibling; node.remove(); node = next; }
  inline.remove();
}
const toc = document.getElementById("toc");
const sections = [...content.querySelectorAll("h2")];
for (const heading of sections) {
  const link = document.createElement("a");
  link.href = `#${heading.id}`;
  link.textContent = heading.textContent;
  toc.append(link);
}
const links = [...toc.querySelectorAll("a")];
const observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    links.forEach((a) => a.classList.toggle("active", a.hash === `#${entry.target.id}`));
  }
}, { rootMargin: "0px 0px -75% 0px" });
sections.forEach((heading) => observer.observe(heading));

mermaid.initialize({
  startOnLoad: false, theme: "base", securityLevel: "loose",
  themeVariables: {
    fontFamily: "-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif", fontSize: "14px",
    primaryColor: "#ffffff", primaryBorderColor: "#000000", primaryTextColor: "#000000",
    lineColor: "#000000", secondaryColor: "#f5f5f5", tertiaryColor: "#ffffff",
    clusterBkg: "#fafafa", clusterBorder: "#000000", edgeLabelBackground: "#ffffff",
  },
});
mermaid.run({ querySelector: ".mermaid" }).catch((error) => {
  console.error(error);
  document.querySelectorAll(".mermaid:not([data-processed])").forEach((el) => el.classList.add("failed"));
});
</script>
