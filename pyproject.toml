[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soren"
version = "0.1.0"
description = "A reinforcement learning agent for source-level vulnerability localization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "torch>=2.3",
    "tensorboard>=2.15",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
embed = [
    "transformers>=4.40",
]
notebook = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["soren"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests, deselected in CI with -m 'not slow'",
]
